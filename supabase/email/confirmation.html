<!doctype html><html><body style="margin:0;background:#faf7fd;font-family:Helvetica,Arial,sans-serif;color:#2a2039">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px"><tr><td align="center">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#ffffff;border:1px solid #e9dff5;border-radius:24px;padding:40px 32px">
<tr><td align="center">
<img src="https://laribrows.com.br/email/logo.png" width="300" height="113" alt="Lari Brows · studio de sobrancelhas" style="display:block;margin:0 auto 24px;border:0;outline:none;width:300px;max-width:100%;height:auto;font-family:Georgia,serif;font-size:22px;color:#2a2039">
<p style="margin:0 0 8px;font-family:Georgia,serif;font-size:24px">Bem-vinda 💜</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#5a4672">Que bom ter você por aqui! Use o código abaixo para entrar na sua área da cliente, ou toque no botão.</p>
<p style="margin:0 0 6px;font-size:11px;letter-spacing:3px;color:#8a7a9e;text-transform:uppercase">seu código</p>
<p style="margin:0 0 28px;font-family:Georgia,serif;font-size:40px;letter-spacing:10px;color:#2a2039">{{ .Token }}</p>
<a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/minha-conta" style="display:inline-block;background:#2a2039;color:#ffffff;text-decoration:none;font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:14px 28px;border-radius:999px">Entrar na minha conta</a>
<p style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#8a7a9e">O código vale por 1 hora. Se não foi você, é só ignorar este e-mail.</p>
</td></tr></table></td></tr></table></body></html>
